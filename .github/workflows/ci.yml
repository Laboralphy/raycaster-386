name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck, lint, format, test and build: the same gate a release runs.
      # The MapEdit save is committed, so a skipped fidelity suite here means
      # something went missing, not that the fixture is optional.
      - run: npm run check
        env:
          RAYCASTER_REQUIRE_FIXTURES: '1'

      - run: npm run types
